<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1422"><title>مدیریت تیکت‌های پشتیبانی</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{font-family:Tahoma,Arial,sans-serif;color:#edf3fa;background:#09111c}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#09111c,#101c2b);min-height:100vh}button,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 14px;background:#d6b15e;color:#15120b;font-weight:bold}.secondary{background:#1b2939;color:#e9eff7;border:1px solid #344458}.wrap{max-width:1200px;margin:auto;padding:18px}.head{display:flex;align-items:center;gap:12px;padding:12px 0 18px}.head h1{font-size:20px;margin:0}.head p{font-size:11px;color:#9caec1;margin:6px 0 0}.head .secondary{margin-right:auto}.login{max-width:420px;margin:9vh auto;background:#111e2e;border:1px solid #293c51;border-radius:18px;padding:22px}.login input{width:100%;margin:8px 0;padding:13px;border-radius:10px;background:#09131f;color:white;border:1px solid #33455a}.layout{display:grid;grid-template-columns:340px minmax(0,1fr);gap:14px}.card{background:#111e2c;border:1px solid #26394d;border-radius:16px;overflow:hidden;min-height:65vh}.card h2{font-size:14px;padding:15px;margin:0;border-bottom:1px solid #27394b}.list{max-height:75vh;overflow:auto}.item{display:block;width:100%;text-align:right;background:transparent;color:#e9f0f7;border-bottom:1px solid #243445;border-radius:0;padding:14px}.item.active,.item:hover{background:#1b3046}.item small{display:block;color:#a0b3c6;font-size:10px;margin-top:7px}.thread{padding:14px;max-height:58vh;overflow:auto;min-height:35vh}.msg{white-space:pre-wrap;overflow-wrap:anywhere;padding:11px 12px;border-radius:12px;max-width:86%;margin:8px 0;line-height:1.8;font-size:12px}.msg.user{background:#23364a;margin-right:auto}.msg.admin{background:#3c3322;margin-left:auto}.msg small{display:block;font-size:9px;color:#9cabbc;margin-top:4px}.reply{display:flex;gap:8px;padding:12px;border-top:1px solid #27394b}.reply textarea{flex:1;min-height:48px;max-height:140px;resize:vertical;border:1px solid #35485d;background:#09131f;color:white;border-radius:10px;padding:12px}.actions{display:flex;gap:8px;align-items:center;padding:0 12px 12px}.status{padding:8px 12px;color:#c5d2e0;font-size:11px;min-height:24px}.empty{padding:24px;color:#9caec1;font-size:12px;text-align:center}.stats{font-size:11px;color:#9caec1;margin-right:auto}@media(max-width:760px){.wrap{padding:10px}.layout{grid-template-columns:1fr}.card{min-height:0}.list{max-height:34vh}.thread{max-height:45vh}.head h1{font-size:16px}}
</style></head><body><div class="wrap"><section id="login" class="login"><h2 style="margin-top:0">ورود مدیریت تیکت‌ها</h2><p style="font-size:12px;color:#9caec1;line-height:1.8">با حساب مدیریت سامانه وارد شوید. فقط حساب مجاز مدیریت به تیکت‌ها دسترسی دارد.</p><input id="email" type="email" value="mohammadrezadaemiii@gmail.com" autocomplete="username"><input id="password" type="password" placeholder="رمز عبور" autocomplete="current-password"><button id="loginBtn" style="width:100%">ورود</button><div id="loginStatus" class="status"></div></section><main id="app" hidden><header class="head"><div><h1>صندوق تیکت‌های پشتیبانی</h1><p>گفت‌وگوهای خصوصی کاربران سامانه</p></div><span id="stats" class="stats"></span><button class="secondary" id="refresh">به‌روزرسانی</button><button id="logout">خروج</button></header><div class="layout"><section class="card"><h2>تیکت‌ها</h2><div id="list" class="list"><div class="empty">در حال بارگذاری…</div></div></section><section class="card"><h2 id="ticketTitle">یک تیکت را انتخاب کنید</h2><div id="thread" class="thread"><div class="empty">پیام‌های تیکت در این قسمت نمایش داده می‌شود.</div></div><div class="reply"><textarea id="replyText" maxlength="5000" placeholder="پاسخ مدیریت را بنویسید…" disabled></textarea><button id="send" disabled>ارسال پاسخ</button></div><div class="actions"><button id="closeTicket" class="secondary" disabled>بستن تیکت</button><button id="reopenTicket" class="secondary" disabled>بازگشایی</button></div><div id="status" class="status"></div></section></div></main></div>
<script>
const URL="https://jfixjlygjukrlokdznhh.supabase.co",KEY="sb_publishable_JpVcwEzZzpPcDwj9PhkZHQ_AoKpw9Kt",ADMIN="mohammadrezadaemiii@gmail.com",db=supabase.createClient(URL,KEY);const $=id=>document.getElementById(id);let user=null,tickets=[],selected=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const dt=d=>new Date(d).toLocaleString("fa-IR",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});const label=s=>s==="answered"?"پاسخ داده شد":s==="closed"?"بسته شده":"در انتظار پاسخ";function msg(s){$("status").textContent=s||""}
async function boot(){const r=await db.auth.getSession();if(r.data.session?.user?.email?.toLowerCase()===ADMIN){user=r.data.session.user;show()}else if(r.data.session){await db.auth.signOut();$("loginStatus").textContent="این حساب دسترسی مدیریت تیکت‌ها را ندارد."}}
function show(){$("login").hidden=true;$("app").hidden=false;load()}
$("loginBtn").onclick=async()=>{const r=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(r.error){$("loginStatus").textContent="ورود ناموفق بود؛ ایمیل و رمز را بررسی کنید.";return}if(r.data.user?.email?.toLowerCase()!==ADMIN){await db.auth.signOut();$("loginStatus").textContent="این حساب دسترسی مدیریت ندارد.";return}user=r.data.user;show()};$("password").onkeydown=e=>{if(e.key==="Enter")$("loginBtn").click()};$("logout").onclick=async()=>{await db.auth.signOut();location.reload()};$("refresh").onclick=load;
async function load(){if(!user)return;const r=await db.from("support_tickets").select("id,user_id,user_email,subject,status,created_at,updated_at").order("updated_at",{ascending:false});if(r.error){msg("بارگذاری ناموفق بود؛ دسترسی پایگاه داده را بررسی کنید.");return}tickets=r.data||[];$("stats").textContent=tickets.length+" تیکت";$("list").innerHTML=tickets.length?tickets.map(t=>'<button class="item '+(t.id===selected?"active":"")+'" data-id="'+t.id+'">'+esc(t.subject)+'<small>کاربر: '+esc(t.user_email||t.user_id)+'<br>'+esc(label(t.status))+' · '+esc(dt(t.updated_at))+'</small></button>').join(""):'<div class="empty">هنوز تیکتی ثبت نشده است.</div>';$("list").querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>openTicket(b.dataset.id));if(selected&&tickets.some(t=>t.id===selected))await openTicket(selected)}
async function openTicket(id){selected=id;const t=tickets.find(x=>x.id===id);if(!t)return;$("ticketTitle").textContent=t.subject+" · "+label(t.status);$("replyText").disabled=false;$("send").disabled=false;$("closeTicket").disabled=t.status==="closed";$("reopenTicket").disabled=t.status!=="closed";$("list").querySelectorAll("[data-id]").forEach(b=>b.classList.toggle("active",b.dataset.id===id));const r=await db.from("support_ticket_messages").select("sender_role,message,created_at").eq("ticket_id",id).order("created_at",{ascending:true});if(r.error){msg("پیام‌ها بارگذاری نشدند.");return}$("thread").innerHTML=(r.data||[]).map(m=>'<div class="msg '+(m.sender_role==="admin"?"admin":"user")+'">'+esc(m.message)+'<small>'+(m.sender_role==="admin"?"مدیریت":"کاربر")+' · '+esc(dt(m.created_at))+'</small></div>').join("")||'<div class="empty">پیامی وجود ندارد.</div>';$("thread").scrollTop=$("thread").scrollHeight;msg("")}
$("send").onclick=async()=>{if(!selected||!user)return;const message=$("replyText").value.trim();if(!message)return;$("send").disabled=true;const r=await db.from("support_ticket_messages").insert({ticket_id:selected,sender_id:user.id,sender_role:"admin",message});if(r.error){msg("ارسال پاسخ ناموفق بود.");$("send").disabled=false;return}await db.from("support_tickets").update({status:"answered",updated_at:new Date().toISOString()}).eq("id",selected);$("replyText").value="";msg("پاسخ برای کاربر ثبت شد.");$("send").disabled=false;await load()};
async function setClosed(closed){if(!selected)return;const r=await db.from("support_tickets").update({status:closed?"closed":"open",updated_at:new Date().toISOString()}).eq("id",selected);if(r.error){msg("تغییر وضعیت ناموفق بود.");return}await load();msg(closed?"تیکت بسته شد.":"تیکت بازگشایی شد.")};$("closeTicket").onclick=()=>setClosed(true);$("reopenTicket").onclick=()=>setClosed(false);db.auth.onAuthStateChange((_e,s)=>{if(!s){user=null;$("app").hidden=true;$("login").hidden=false}});boot();
</script></body></html>
