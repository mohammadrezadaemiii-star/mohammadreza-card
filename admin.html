<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل خصوصی محمدرضا</title><style>body{margin:0;background:#090909;color:#eee;font-family:Tahoma;padding:20px}.wrap{max-width:760px;margin:auto}.box{background:#111;border:1px solid #3b3120;border-radius:18px;padding:18px;margin:14px 0}.gold{color:#d7b56c}input,textarea,button{font:inherit;width:100%;box-sizing:border-box;padding:12px;border-radius:10px;margin:7px 0;background:#0b0b0b;color:#eee;border:1px solid #4a3b23}button{cursor:pointer;border-color:#b89550}.meta{font-size:11px;color:#888}.status{color:#d7b56c;font-size:13px}.hide{display:none}</style><body><div class="wrap"><h2 class="gold">پنل خصوصی محمدرضا</h2><section id="login" class="box"><div>ورود با ایمیل</div><input id="email" type="email" value="mohammadrezadaemiii@gmail.com"><button id="send">ارسال لینک ورود</button><div id="loginStatus" class="status"></div></section><section id="panel" class="hide"><button id="refresh">↻ بروزرسانی</button><div id="status" class="status"></div><div id="messages"></div></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const U="https://jfixjlygjukrlokdznhh.supabase.co",K="sb_publishable_JpVcwEzZzpPcDwj9PhkZHQ_AoKpw9Kt",db=supabase.createClient(U,K);
const L=document.getElementById("login"),P=document.getElementById("panel"),M=document.getElementById("messages"),S=document.getElementById("status");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function load(){S.textContent="در حال بارگذاری...";const q=await db.from("anonymous_messages").select("id,message,contact,created_at,wants_reply,reply,replied_at").order("created_at",{ascending:false});if(q.error){S.textContent=q.error.message;return}S.textContent="";M.innerHTML=(q.data||[]).map(x=>'<div class="box"><div class="meta">'+new Date(x.created_at).toLocaleString("fa-IR")+' · '+(x.wants_reply?"منتظر جواب":"بدون نیاز به جواب")+'</div><div style="white-space:pre-wrap;margin:10px 0">'+esc(x.message)+'</div><div class="meta">راه ارتباطی: '+esc(x.contact||"ثبت نشده")+'</div><textarea id="r'+x.id+'" rows="3" placeholder="جوابت را بنویس...">'+esc(x.reply||"")+'</textarea><button data-id="'+x.id+'">ارسال جواب و نوتیفیکیشن</button><div id="s'+x.id+'" class="status"></div></div>').join("");M.querySelectorAll("button").forEach(b=>b.onclick=()=>reply(+b.dataset.id))}
async function reply(id){const s=document.getElementById("s"+id),reply=document.getElementById("r"+id).value.trim();if(!reply){s.textContent="جواب خالیه.";return}s.textContent="در حال ارسال...";const u=await db.from("anonymous_messages").update({reply,replied_at:new Date().toISOString()}).eq("id",id);if(u.error){s.textContent=u.error.message;return}const r=await db.functions.invoke("send-reply-push",{body:{message_id:id}});s.textContent=r.error?"جواب ذخیره شد؛ Push ارسال نشد.":"جواب ارسال شد و نوتیفیکیشن فرستاده شد 🔔";load()}
document.getElementById("send").onclick=async()=>{const email=document.getElementById("email").value.trim();const r=await db.auth.signInWithOtp({email,options:{emailRedirectTo:location.href}});document.getElementById("loginStatus").textContent=r.error?r.error.message:"لینک ورود به ایمیل ارسال شد."};
document.getElementById("refresh").onclick=load;db.auth.onAuthStateChange((_e,s)=>{if(s){L.classList.add("hide");P.classList.remove("hide");load()}});db.auth.getSession().then(({data})=>{if(data.session){L.classList.add("hide");P.classList.remove("hide");load()}});
</script></body></html>
