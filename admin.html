<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>پنل خصوصی محمدرضا</title>

<link rel="manifest" href="./admin-manifest.json">
<meta name="theme-color" content="#090909">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{
 --bg:#090909;
 --head:#171717;
 --panel:#111;
 --bubble:#252525;
 --mine:#44351f;
 --line:#2d2923;
 --gold:#d7b56c;
 --muted:#969087;
 --text:#f5f1e8;
 --green:#61dcd3;
}

*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 height:100%;
 background:var(--bg);
 color:var(--text);
 font-family:Tahoma,Arial,sans-serif;
}

body{overflow:hidden}

button,input,textarea{
 font:inherit;
}

button{
 cursor:pointer;
}

.hide{
 display:none!important;
}

/* LOGIN */

.login{
 width:min(460px,calc(100% - 32px));
 margin:10vh auto 0;
 background:#121210;
 border:1px solid #30291d;
 border-radius:20px;
 padding:22px;
 box-shadow:0 20px 60px #000;
}

.login h3{
 margin-top:0;
}

.login input{
 width:100%;
 background:#0b0b0a;
 color:var(--text);
 border:1px solid #403622;
 border-radius:12px;
 padding:12px;
 margin-top:9px;
}

.login button{
 width:100%;
 border:0;
 border-radius:12px;
 padding:12px;
 margin-top:9px;
 background:linear-gradient(180deg,#d9b96f,#a98a4d);
 color:#17130b;
 font-weight:700;
}

.login .secondary{
 background:#171716;
 color:#ddd5c7;
 border:1px solid #403622;
}

.small,.status{
 font-size:11px;
 color:var(--muted);
 line-height:1.8;
 margin-top:8px;
}

/* PANEL */

#panel{
 width:100%;
 height:100vh;
 display:flex;
}

.sidebar{
 width:350px;
 height:100%;
 flex:0 0 350px;
 background:#101010;
 border-left:1px solid var(--line);
 display:flex;
 flex-direction:column;
}

.sideHead{
 min-height:70px;
 background:var(--head);
 display:flex;
 align-items:center;
 padding:10px 14px;
 gap:10px;
}

.brandMark{
 width:42px;
 height:42px;
 border-radius:13px;
 display:grid;
 place-items:center;
 border:1px solid #5bcfc6;
 background:linear-gradient(145deg,#17302e,#33291a);
 flex:0 0 42px;
}

.brandMark svg{
 width:28px;
 height:28px;
}

.sideTitle{
 font-size:16px;
 font-weight:700;
}

.sideSub{
 font-size:10px;
 color:var(--muted);
 margin-top:3px;
}

.search{
 padding:9px;
 background:#101010;
 border-bottom:1px solid var(--line);
}

.search input{
 width:100%;
 margin:0;
 background:#0b0b0a;
 color:var(--text);
 border:1px solid #403622;
 border-radius:18px;
 padding:10px 14px;
 outline:none;
}

.people{
 flex:1;
 overflow:auto;
}

.person{
 display:flex;
 gap:10px;
 padding:12px;
 border-bottom:1px solid #24221e;
 cursor:pointer;
 align-items:center;
}

.person:hover,
.person.active{
 background:#1c1b19;
}

.pavatar{
 width:46px;
 height:46px;
 flex:0 0 46px;
 border-radius:50%;
 display:grid;
 place-items:center;
 background:linear-gradient(145deg,#d7b56c,#725426);
 color:#17130b;
 font-weight:800;
}

.pname{
 font-size:13px;
 font-weight:700;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.plast{
 font-size:11px;
 color:#aaa298;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
 margin-top:5px;
}

.ptime{
 font-size:9px;
 color:#817b71;
 margin-right:auto;
 align-self:flex-start;
 white-space:nowrap;
}

.badge{
 min-width:19px;
 height:19px;
 padding:2px 6px;
 border-radius:99px;
 background:#a98a4d;
 color:#111;
 font-size:9px;
 text-align:center;
 margin-top:5px;
}

/* CHAT */

.chat{
 flex:1;
 height:100%;
 min-width:0;
 display:flex;
 flex-direction:column;
 background:#0b0b0b;
}

.chatHead{
 min-height:70px;
 background:var(--head);
 border-bottom:1px solid var(--line);
 display:flex;
 align-items:center;
 gap:11px;
 padding:9px 15px;
}

.chatHead .pavatar{
 width:43px;
 height:43px;
 flex-basis:43px;
}

.chatName{
 font-weight:700;
 font-size:15px;
}

.chatSub{
 font-size:10px;
 color:var(--muted);
 margin-top:4px;
}

.chatActions{
 margin-right:auto;
 display:flex;
 gap:6px;
}

.chatActions button,
#logout2{
 width:auto;
 margin:0;
 padding:8px 11px;
 border-radius:10px;
 border:1px solid #403622;
 background:#171716;
 color:#ddd5c7;
}

.chatBody{
 flex:1;
 overflow:auto;
 padding:18px 15px;
 background-image:
 radial-gradient(circle at 15% 15%,#d7b56c0a,transparent 25%),
 radial-gradient(circle at 85% 75%,#d7b56c08,transparent 28%);
}

.emptyChat{
 margin:auto;
 text-align:center;
 color:#777168;
 font-size:12px;
 line-height:2;
}

.day{
 text-align:center;
 margin:5px auto 15px;
 background:#24221e;
 color:#a59e92;
 border-radius:99px;
 padding:5px 12px;
 width:max-content;
 font-size:9px;
}

.bubble{
 max-width:min(72%,520px);
 padding:10px 12px;
 border-radius:16px;
 margin:5px 0;
 line-height:1.8;
 font-size:13px;
 white-space:pre-wrap;
 word-break:break-word;
 box-shadow:0 2px 5px #0005;
}

.incoming{
 margin-right:auto;
 background:var(--bubble);
 border-bottom-right-radius:5px;
}

.outgoing{
 margin-left:auto;
 background:var(--mine);
 border-bottom-left-radius:5px;
}

.timeRow{
 display:flex;
 align-items:center;
 gap:6px;
 justify-content:flex-start;
 direction:ltr;
}

.time{
 font-size:9px;
 color:#928b80;
 margin-top:3px;
}

.ticks{
 font-size:11px;
 color:#9a948b;
 letter-spacing:-3px;
}

.ticks.read{
 color:var(--green);
}

.mediaImg{
 max-width:280px;
 max-height:300px;
 border-radius:12px;
 display:block;
 margin-top:7px;
}

.audio{
 width:250px;
 max-width:100%;
 margin-top:7px;
}

.fileLink{
 display:block;
 margin-top:8px;
 padding:8px 10px;
 background:#181816;
 border-radius:9px;
 color:#e2c57c;
 text-decoration:none;
 font-size:11px;
}

/* BIO */

.bio{
 padding:14px;
 background:#101010;
 border-top:1px solid var(--line);
 border-bottom:1px solid var(--line);
 max-height:260px;
 overflow:auto;
}

.bioTitle{
 font-size:11px;
 color:var(--gold);
 font-weight:700;
 margin-bottom:8px;
}

.bioGrid{
 display:grid;
 grid-template-columns:100px 1fr;
 gap:6px 10px;
 font-size:10px;
}

.bioGrid span:nth-child(odd){
 color:#858077;
}

.bioGrid span:nth-child(even){
 direction:ltr;
 text-align:right;
 word-break:break-all;
 color:#d6d0c6;
}

/* REPLY */

.replyPreview{
 display:none;
 padding:7px 10px;
 background:#171717;
 border-top:1px solid var(--line);
 font-size:10px;
 color:#bcb4a7;
 gap:8px;
 align-items:center;
}

.replyPreview.show{
 display:flex;
}

.replyPreview img{
 width:48px;
 height:48px;
 object-fit:cover;
 border-radius:8px;
}

.replyBar{
 padding:9px;
 background:#171717;
 border-top:1px solid var(--line);
 display:flex;
 gap:7px;
 align-items:flex-end;
}

.replyBar textarea{
 flex:1;
 min-width:0;
 min-height:44px;
 max-height:130px;
 resize:none;
 border-radius:18px;
 background:#0b0b0a;
 color:var(--text);
 border:1px solid #403622;
 padding:11px 14px;
 outline:none;
}

.replyTool{
 width:43px!important;
 flex:0 0 43px!important;
 height:43px;
 margin:0!important;
 padding:0!important;
 border-radius:50%!important;
 background:#20201e!important;
 color:var(--gold)!important;
 border:1px solid #403622!important;
}

.replySend{
 width:70px!important;
 flex:0 0 70px!important;
 height:43px;
 margin:0!important;
 padding:0!important;
 border:0!important;
 border-radius:18px!important;
 background:linear-gradient(180deg,#d9b96f,#a98a4d)!important;
 color:#17130b!important;
 font-weight:700;
}

.replyFile{
 display:none;
}

.topMobile{
 display:none;
}

/* MOBILE */

@media(max-width:700px){

 body{
  overflow:hidden;
 }

 #panel{
  display:block;
 }

 .sidebar{
  width:100%;
  height:100%;
  border:0;
 }

 .chat{
  display:none;
  width:100%;
  height:100%;
 }

 .wrap.chatOpen .sidebar{
  display:none;
 }

 .wrap.chatOpen .chat{
  display:flex;
 }

 .topMobile{
  display:block;
 }

 .chatHead{
  min-height:64px;
  height:64px;
  padding:8px 10px;
 }

 .bio{
  max-height:210px;
 }

 .bubble{
  max-width:84%;
 }

 .replyBar{
  padding:7px;
  gap:5px;
 }

 .replySend{
  width:60px!important;
  flex-basis:60px!important;
 }
}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://jfixjlygjukrlokdznhh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_JpVcwEzZzpPcDwj9PhkZHQ_AoKpw9Kt";

const ADMIN_EMAIL =
"mohammadrezadaemiii@gmail.com";

const ADMIN_REDIRECT_URL =
"https://mohammadrezaemiii-star.github.io/mohammadreza-card/admin.html";

const db =
supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);


const loginBox =
document.getElementById("login");

const recoveryBox =
document.getElementById("recovery");

const panel =
document.getElementById("panel");

const people =
document.getElementById("people");

const messages =
document.getElementById("messages");

const bio =
document.getElementById("bio");

const replyBar =
document.getElementById("replyBar");

const wrap =
document.querySelector("body");


let all = [];
let profiles = [];
let selected = null;

let replyFileSelected = null;

let replyRecorder = null;
let replyAudioChunks = [];

let loading = false;


/* HELPERS */

function esc(value){
 return String(value ?? "")
  .replace(/[&<>"']/g,m=>({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#039;"
  }[m]));
}


function fmtTime(value){
 const d = new Date(value);

 return d.toLocaleTimeString(
  "fa-IR",
  {
   hour:"2-digit",
   minute:"2-digit"
  }
 );
}


function fmtDate(value){
 const d = new Date(value);

 return d.toLocaleDateString(
  "fa-IR",
  {
   year:"numeric",
   month:"long",
   day:"numeric"
  }
 );
}


function fmtFull(value){
 const d = new Date(value);

 return d.toLocaleString(
  "fa-IR",
  {
   year:"numeric",
   month:"2-digit",
   day:"2-digit",
   hour:"2-digit",
   minute:"2-digit"
  }
 );
}


function isOnline(lastSeen){

 if(!lastSeen) return false;

 return (
  Date.now() -
  new Date(lastSeen).getTime()
 ) < 45000;
}


function initials(name){

 const value =
 String(name || "AI")
  .trim()
  .split(/\s+/)
  .filter(Boolean);

 if(value.length >= 2){
  return (
   value[0][0] +
   value[1][0]
  ).toUpperCase();
 }

 return (
  value[0] ||
  "AI"
 ).slice(0,2).toUpperCase();
}


function profileFor(id){
 return profiles.find(
  p => p.visitor_id === id
 ) || null;
}


/* GROUP */

function groupMessages(){

 const map = new Map();

 for(const row of all){

  const id =
   row.visitor_id ||
   ("legacy-" + row.id);

  if(!map.has(id)){
   map.set(id,[]);
  }

  map.get(id).push(row);
 }


 const result =
 [...map.entries()]
 .map(([id,rows])=>{

  rows.sort(
   (a,b)=>
    new Date(a.created_at) -
    new Date(b.created_at)
  );

  return {
   id,
   rows
  };
 });


 result.sort(
  (a,b)=>
   latestActivity(b) -
   latestActivity(a)
 );

 return result;
}


function latestActivity(g){

 let latest = 0;

 for(const r of g.rows){

  const created =
   new Date(r.created_at).getTime();

  if(created > latest){
   latest = created;
  }

  if(r.replied_at){

   const replied =
    new Date(r.replied_at).getTime();

   if(replied > latest){
    latest = replied;
   }
  }
 }

 return latest;
}


/* EVENTS */

function eventList(g){

 const events = [];

 for(const r of g.rows){

  events.push({
   type:"visitor",
   time:r.created_at,
   row:r
  });


  if(
   r.reply ||
   (Array.isArray(r.reply_attachments) &&
    r.reply_attachments.length)
  ){

   events.push({
    type:"admin",
    time:r.replied_at || r.created_at,

    row:{
     ...r,

     message:r.reply,

     attachments:
      Array.isArray(r.reply_attachments)
       ? r.reply_attachments
       : [],

     created_at:
      r.replied_at || r.created_at
    }
   });
  }
 }


 events.sort((a,b)=>{

  const diff =
   new Date(a.time) -
   new Date(b.time);

  if(diff !== 0){
   return diff;
  }

  if(a.type === b.type){
   return (
    Number(a.row.id) -
    Number(b.row.id)
   );
  }

  return a.type === "visitor" ? -1 : 1;
 });


 return events;
}


/* MEDIA */

async function mediaHtml(attachments){

 if(!Array.isArray(attachments)){
  return "";
 }

 let html = "";

 for(const a of attachments){

  if(!a || !a.path){
   continue;
  }

  const result =
   await db.storage
    .from("chat-media")
    .createSignedUrl(
     a.path,
     3600
    );

  const url =
   result.data?.signedUrl;

  if(!url){
   continue;
  }


  if(a.type === "image"){

   html +=
    '<img class="mediaImg" ' +
    'src="' + esc(url) + '" ' +
    'alt="عکس">';

  }

  else if(a.type === "audio"){

   html +=
    '<audio class="audio" controls ' +
    'src="' + esc(url) + '">' +
    '</audio>';

  }

  else{

   html +=
    '<a class="fileLink" ' +
    'href="' + esc(url) + '" ' +
    'target="_blank" ' +
    'rel="noopener">' +
    '📎 ' +
    esc(a.name || "فایل") +
    '</a>';
  }
 }

 return html;
}


/* SIDEBAR */

function latestPreview(g){

 const events =
  eventList(g);

 if(!events.length){
  return "پیام";
 }

 const last =
  events[events.length - 1];

 if(last.type === "admin"){
  return (
   "شما: " +
   (
    last.row.message ||
    (
     last.row.attachments?.length
      ? "📎 فایل"
      : "پیام"
    )
   )
  );
 }

 return (
  last.row.message ||
  (
   last.row.attachments?.length
    ? "📎 فایل"
    : "پیام"
  )
 );
}


function renderPeople(){

 const groups =
  groupMessages();

 const q =
  (
   document.getElementById("search").value ||
   ""
  )
  .trim()
  .toLowerCase();


 people.innerHTML = "";


 for(const g of groups){

  const p =
   profileFor(g.id);

  const name =
   p?.name ||
   (
    g.id.startsWith("legacy-")
     ? "مخاطب قدیمی"
     : "مخاطب ناشناس"
   );


  const searchText =
   (
    name +
    " " +
    (p?.phone || "") +
    " " +
    g.rows
     .map(x=>x.message || "")
     .join(" ")
   )
   .toLowerCase();


  if(
   q &&
   !searchText.includes(q)
  ){
   continue;
  }


  const pending =
   g.rows.filter(
    x =>
     x.wants_reply &&
     !x.reply &&
     !x.reply_attachments?.length
   ).length;


  const online =
   isOnline(p?.last_seen_at);


  const el =
   document.createElement("div");


  el.className =
   "person " +
   (
    selected === g.id
     ? "active"
     : ""
   );


  el.innerHTML =

   '<div class="pavatar">' +
   esc(initials(name)) +
   '</div>' +

   '<div style="min-width:0;flex:1">' +

    '<div class="pname">' +

     (
      online
       ? '<span style="' +
         'width:7px;height:7px;' +
         'border-radius:50%;' +
         'background:#65d7cd;' +
         'display:inline-block;' +
         'margin-left:4px"></span>'
       : ""
     ) +

     esc(name) +

    '</div>' +

    '<div class="plast">' +
     esc(latestPreview(g)) +
    '</div>' +

   '</div>' +

   '<div>' +

    '<div class="ptime">' +
     fmtTime(latestActivity(g)) +

/* READ */

async function markAdminRead(g){

 const ids =
  g.rows
   .filter(r=>!r.admin_read_at)
   .map(r=>r.id);


 if(!ids.length){
  return;
 }


 const timestamp =
  new Date().toISOString();


 const result =
  await db
   .from("anonymous_messages")
   .update({
    admin_read_at:timestamp
   })
   .in("id",ids);


 if(result.error){
  console.warn(
   "markAdminRead:",
   result.error.message
  );
 }


 /* update local data immediately */

 for(const row of all){

  if(ids.includes(row.id)){
   row.admin_read_at =
    timestamp;
  }
 }
}


/* OPEN CHAT */

async function openPerson(id){

 const g =
  groupMessages()
   .find(x=>x.id === id);


 if(!g){
  return;
 }


 selected = id;


 const p =
  profileFor(id);


 const name =
  p?.name ||
  (
   id.startsWith("legacy-")
    ? "مخاطب قدیمی"
    : "مخاطب ناشناس"
  );


 document.getElementById(
  "headAvatar"
 ).textContent =
  initials(name);


 document.getElementById(
  "headName"
 ).textContent =
  name;


 document.getElementById(
  "headSub"
 ).textContent =
  isOnline(p?.last_seen_at)
   ? "آنلاین"
   : (
    p?.last_seen_at
     ? "آخرین بازدید: " +
       fmtFull(p.last_seen_at)
     : "آخرین بازدید ثبت نشده"
   );


 renderBio(g);


 replyBar.classList.remove(
  "hide"
 );


 await markAdminRead(g);


 renderPeople();


 messages.innerHTML = "";


 const events =
  eventList(g);


 if(!events.length){

  messages.innerHTML =
   '<div class="emptyChat">' +
   'هنوز پیامی وجود ندارد.' +
   '</div>';

 }else{

  let lastDay = "";


  for(const e of events){

   const currentDay =
    fmtDate(e.time);


   if(currentDay !== lastDay){

    messages.innerHTML +=
     '<div class="day">' +
     esc(currentDay) +
     '</div>';

    lastDay =
     currentDay;
   }


   let content = "";


   if(e.row.message){

    content +=
     '<div>' +
     esc(e.row.message) +
     '</div>';
   }


   content +=
    await mediaHtml(
     e.row.attachments
    );


   if(!content){

    content =
     '<div>📎 فایل</div>';
   }


   let ticks = "";


   if(e.type === "admin"){

    const read =
     !!e.row.visitor_read_at;


    ticks =
     '<span class="ticks ' +
     (read ? "read" : "") +
     '">' +
     (read ? "✓✓" : "✓") +
     '</span>';
   }


   content +=

    '<div class="timeRow">' +

     '<span class="time">' +
      fmtTime(e.time) +
     '</span>' +

     ticks +

    '</div>';


   messages.innerHTML +=

    '<div class="bubble ' +
     (
      e.type === "admin"
       ? "outgoing"
       : "incoming"
     ) +
    '">' +

     content +

    '</div>';
  }
 }


 messages.scrollTop =
  messages.scrollHeight;


 document.getElementById(
  "replyText"
 ).value = "";


 document.querySelector(
  ".replyPreview"
 ).classList.remove("show");


 document.querySelector(
  ".wrap"
 )?.classList.add("chatOpen");
}


/* LOAD */

async function load(){

 if(loading){
  return;
 }

 loading = true;


 try{

  const [
   messagesQuery,
   profilesQuery
  ] =
   await Promise.all([

    db
     .from("anonymous_messages")
     .select(
      "id," +
      "message," +
      "contact," +
      "created_at," +
      "wants_reply," +
      "reply," +
      "replied_at," +
      "attachments," +
      "reply_attachments," +
      "visitor_id," +
      "ip_address," +
      "user_agent," +
      "admin_read_at," +
      "visitor_read_at"
     )
     .order(
      "created_at",
      {
       ascending:true
      }
     ),

    db
     .from("anonymous_visitors")
     .select(
      "visitor_id," +
      "name," +
      "phone," +
      "created_at," +
      "last_seen_at," +
      "last_read_at"
     )
  ]);


  if(messagesQuery.error){

   console.error(
    messagesQuery.error
   );

   return;
  }


  all =
   messagesQuery.data || [];


  profiles =
   profilesQuery.error
    ? []
    : (
      profilesQuery.data || []
    );


  renderPeople();


  if(selected){

   const exists =
    groupMessages()
     .some(g=>g.id===selected);


   if(exists){

    await openPerson(
     selected
    );

   }else{

    selected = null;

    messages.innerHTML =
     '<div class="emptyChat">' +
     'گفت‌وگو را انتخاب کن.' +
     '</div>';
   }
  }

 }finally{

  loading = false;
 }
}


/* FILE UPLOAD */

async function uploadReplyMedia(
 blob,
 ext,
 mime,
 originalName
){

 if(!selected){

  throw new Error(
   "گفت‌وگو انتخاب نشده."
  );
 }


 const path =
  selected +
  "/reply-" +
  crypto.randomUUID() +
  "." +
  ext;


 const result =
  await db.storage
   .from("chat-media")
   .upload(
    path,
    blob,
    {
     contentType:
      mime ||
      blob.type ||
      "application/octet-stream",

     upsert:false
    }
   );


 if(result.error){
  throw result.error;
 }


 const type =
  (
   mime ||
   blob.type ||
   ""
  );


 return {

  type:
   type.startsWith("image/")
    ? "image"
    : type.startsWith("audio/")
     ? "audio"
     : "file",

  path,

  name:
   originalName ||
   ("فایل." + ext)
 };
}

/* VOICE */

document.getElementById(
 "replyMic"
).onclick =
async ()=>{

 const button =
  document.getElementById(
   "replyMic"
  );


 if(
  replyRecorder &&
  replyRecorder.state === "recording"
 ){

  replyRecorder.stop();

  return;
 }


 if(
  !navigator.mediaDevices ||
  !navigator.mediaDevices.getUserMedia
 ){

  alert(
   "مرورگر امکان ضبط ویس ندارد."
  );

  return;
 }


 try{

  const stream =
   await navigator.mediaDevices
    .getUserMedia({
     audio:true
    });


  replyAudioChunks = [];


  replyRecorder =
   new MediaRecorder(
    stream
   );


  replyRecorder.ondataavailable =
   event=>{

    if(event.data.size){

     replyAudioChunks.push(
      event.data
     );
    }
   };


  replyRecorder.onstop =
   ()=>{

    stream
     .getTracks()
     .forEach(
      track=>track.stop()
     );


    try{

     const blob =
      new Blob(
       replyAudioChunks,
       {
        type:
         replyRecorder.mimeType ||
         "audio/webm"
       }
      );


     if(
      blob.size >
      8 * 1024 * 1024
     ){

      throw new Error(
       "حجم ویس بیشتر از ۸ مگابایت است."
      );
     }


     const ext =
      blob.type.includes("mp4")
       ? "m4a"
       : "webm";


     replyFileSelected =
      new File(
       [blob],
       "voice." + ext,
       {
        type:blob.type
       }
      );


     setReplyPreview();


    }catch(error){

     alert(
      error.message ||
      "ضبط ویس ناموفق بود."
     );
    }


    button.textContent =
     "🎙";
   };


  replyRecorder.start();


  button.textContent =
   "⏹";


 }catch(error){

  alert(
   "اجازه دسترسی به میکروفون را بده."
  );
 }
};


/* SEND */

async function sendReply(){

 if(!selected){
  return;
 }


 const groups =
  groupMessages();


 const g =
  groups.find(
   x=>x.id === selected
  );


 if(!g){
  return;
 }


 const reply =
  document.getElementById(
   "replyText"
  ).value.trim();


 if(
  !reply &&
  !replyFileSelected
 ){
  return;
 }


 /*
  فقط آخرین پیام بدون پاسخ را
  انتخاب می‌کنیم.
 */
 const target =
  [...g.rows]
   .reverse()
   .find(
    x =>
     x.wants_reply &&
     !x.reply &&
     !(x.reply_attachments?.length)
   ) ||
  g.rows[g.rows.length - 1];


 if(!target){
  return;
 }


 const sendButton =
  document.getElementById(
   "replyBtn"
  );


 sendButton.disabled = true;
 sendButton.textContent = "…";


 try{

  let attachments = [];


  if(replyFileSelected){

   if(
    replyFileSelected.size >
    8 * 1024 * 1024
   ){

    throw new Error(
     "حجم فایل بیشتر از ۸ مگابایت است."
    );
   }


   const ext =
    (
     replyFileSelected.name
      .split(".")
      .pop() ||
     "bin"
    )
    .replace(
     /[^a-zA-Z0-9]/g,
     ""
    )
    .slice(0,8) ||
    "bin";


   attachments.push(
    await uploadReplyMedia(
     replyFileSelected,
     ext,
     replyFileSelected.type,
     replyFileSelected.name
    )
   );
  }


  const result =
   await db.functions.invoke(
    "send-reply-push",
    {
     body:{
      message_id:
       target.id,

      reply:
       reply ||
       "📎 فایل",

      reply_attachments:
       attachments
     }
    }
   );


  if(result.error){

   throw new Error(
    result.error.message
   );
  }


  document.getElementById(
   "replyText"
  ).value = "";


  replyFileSelected = null;


  document.getElementById(
   "replyFile"
  ).value = "";


  setReplyPreview();


  await load();


  /*
   بعد از ارسال، همان چت باز می‌ماند.
  */
  if(selected){

   await openPerson(
    selected
   );
  }


 }catch(error){

  alert(
   "ارسال انجام نشد: " +
   (
    error.message ||
    error
   )
  );

 }finally{

  sendButton.disabled = false;
  sendButton.textContent = "ارسال";
 }
}
